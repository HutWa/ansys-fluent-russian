name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Python scripts
        run: python -m compileall -q scripts tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Reject proprietary and oversized files
        run: python scripts/check_repository.py

      - name: Validate Fluent 2026 R1 translations
        run: python scripts/validate_translation.py translations/v2026R1

      - name: Generate translation progress report
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if git cat-file -e "$BASE_REF^{commit}" 2>/dev/null; then
            python scripts/report_progress.py --github-summary --base-ref "$BASE_REF"
          else
            python scripts/report_progress.py --github-summary
          fi

      - name: Check visual QA status
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if git cat-file -e "$BASE_REF^{commit}" 2>/dev/null; then
            python scripts/check_visual_review.py --github-summary --base-ref "$BASE_REF"
          else
            python scripts/check_visual_review.py --github-summary
          fi
